syntax = "proto3";

package ecommerce.catalog.v1;

option go_package = "github.com/rajeev/ecommercesagapattern/shared/pb/catalogv1;catalogv1";

// CatalogService manages products and inventory.
// In the Saga pattern, this service plays a critical role in inventory lock-down.
service CatalogService {
  // GetProduct retrieves details of a single product.
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);

  // ListProducts yields a list of products with pagination.
  rpc ListProducts(ListProductsRequest) returns (ListProductsResponse);
  
  // ==========================================
  // SAGA TRANSACTION METHODS
  // ==========================================

  // ReserveStock reserves inventory for a pending order.
  // [Saga Role]: Forward Action. 
  // It locks the items by decrementing available stock and placing it in a "reserved" state.
  // Must be idempotent (guided by order_id).
  rpc ReserveStock(ReserveStockRequest) returns (ReserveStockResponse);

  // ReleaseStock rolls back a previous stock reservation.
  // [Saga Role]: Compensating Action.
  // It is invoked by the Order Service if a subsequent step in the transaction fails 
  // (e.g. if the payment is declined), restoring stock levels.
  // Must be idempotent (guided by order_id).
  rpc ReleaseStock(ReleaseStockRequest) returns (ReleaseStockResponse);
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  int64 price_cents = 4; // Using integer cents (e.g. 999 for $9.99) to prevent float inaccuracies.
  int32 stock = 5;
}

message GetProductRequest {
  string id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message ListProductsRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListProductsResponse {
  repeated Product products = 1;
  string next_page_token = 2;
}

message ReserveItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveStockRequest {
  string order_id = 1;         // Serves as the idempotency key for this reservation
  repeated ReserveItem items = 2;
}

message ReserveStockResponse {
  bool success = 1;
  string message = 2;          // Error details in case of failures (e.g. "Out of stock")
}

message ReleaseStockRequest {
  string order_id = 1;         // Maps back to the reservation to release
  repeated ReserveItem items = 2;
}

message ReleaseStockResponse {
  bool success = 1;
}
