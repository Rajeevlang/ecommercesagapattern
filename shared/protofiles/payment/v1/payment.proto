syntax = "proto3";

package ecommerce.payment.v1;

option go_package = "github.com/rajeev/ecommercesagapattern/shared/pb/paymentv1;paymentv1";

// PaymentService handles transaction charging and refunding.
// In the Saga pattern, payment processing is usually the high-risk step.
service PaymentService {
  // ProcessPayment charges the client's payment instrument (e.g. Stripe card).
  // [Saga Role]: Forward Action.
  // This is triggered by the Saga Orchestrator after stock has been successfully reserved.
  // Must be idempotent using order_id to prevent double-charging clients.
  rpc ProcessPayment(ProcessPaymentRequest) returns (ProcessPaymentResponse);

  // CancelPayment refunds or voids a payment.
  // [Saga Role]: Compensating Action.
  // If payment succeeded but a subsequent step in the transaction fails, 
  // this is invoked by the Orchestrator to void the charge or issue a refund.
  // Must be idempotent.
  rpc CancelPayment(CancelPaymentRequest) returns (CancelPaymentResponse);
}

message ProcessPaymentRequest {
  string order_id = 1;         // Maps this transaction to the unique Order ID (used as Idempotency Key)
  string user_id = 2;
  int64 amount_cents = 3;      // Transaction amount in cents
  string payment_method_token = 4; // Mock payment token from the gateway frontend (e.g., Stripe token)
}

message ProcessPaymentResponse {
  string payment_id = 1;       // Unique transaction id generated by the payment processor
  bool success = 2;            // True if payment is successful
  string transaction_status = 3; // Detailed status string (e.g., "AUTHORIZED", "DECLINED")
  string error_message = 4;    // Human-readable message in case of payment rejection
}

message CancelPaymentRequest {
  string order_id = 1;
  string payment_id = 2;       // The payment identifier to refund or void
  string reason = 3;           // Reason for cancellation (e.g. "Stock allocation failed")
}

message CancelPaymentResponse {
  bool success = 1;            // True if the refund/void went through
}
